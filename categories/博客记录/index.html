<script id="xxf-local-search-script">
(() => {
  if (window.__xxfLocalSearchReady) return;
  window.__xxfLocalSearchReady = true;

  let records = null;
  const stripHtml = value => {
    const box = document.createElement('div');
    box.innerHTML = value || '';
    return (box.textContent || '').replace(/\s+/g, ' ').trim();
  };

  const overlay = document.createElement('div');
  overlay.id = 'xxf-search-overlay';
  overlay.innerHTML = '<section class="xxf-search-panel" role="dialog" aria-modal="true" aria-label="站内搜索"><div class="xxf-search-head"><i class="ic i-search"></i><input id="xxf-search-input" type="search" autocomplete="off" placeholder="搜索文章标题、标签或正文…"><button id="xxf-search-close" type="button" aria-label="关闭搜索">×</button></div><div id="xxf-search-status">输入关键词开始搜索</div><div id="xxf-search-results"><div class="xxf-search-empty">在 XXF Studio 中寻找你感兴趣的内容 ✦</div></div></section>';
  document.body.appendChild(overlay);

  const input = overlay.querySelector('#xxf-search-input');
  const status = overlay.querySelector('#xxf-search-status');
  const results = overlay.querySelector('#xxf-search-results');

  const close = () => {
    overlay.classList.remove('open');
    document.body.classList.remove('xxf-search-lock');
  };
  const open = async () => {
    overlay.classList.add('open');
    document.body.classList.add('xxf-search-lock');
    input.focus();
    if (!records) {
      status.textContent = '正在准备搜索索引…';
      try {
        const response = await fetch('/search.xml', { cache: 'no-store' });
        const raw = await response.text();
        if (raw.trim().startsWith('[')) {
          records = JSON.parse(raw);
        } else {
          const xml = new DOMParser().parseFromString(raw, 'application/xml');
          records = Array.from(xml.querySelectorAll('entry')).map(entry => ({
            title: entry.querySelector('title')?.textContent || '',
            url: entry.querySelector('url')?.textContent || entry.querySelector('link')?.getAttribute('href') || '',
            content: entry.querySelector('content')?.textContent || '',
            categories: Array.from(entry.querySelectorAll('category')).map(node => node.textContent || ''),
            tags: Array.from(entry.querySelectorAll('tag')).map(node => node.textContent || '')
          }));
        }
        status.textContent = '已收录 ' + records.length + ' 篇文章，输入关键词开始搜索';
      } catch (error) {
        records = [];
        status.textContent = '搜索索引加载失败，请刷新页面后重试';
      }
    }
  };

  const render = query => {
    const keyword = query.trim().toLowerCase();
    results.replaceChildren();
    if (!keyword) {
      status.textContent = records ? '已收录 ' + records.length + ' 篇文章，输入关键词开始搜索' : '输入关键词开始搜索';
      const empty = document.createElement('div');
      empty.className = 'xxf-search-empty';
      empty.textContent = '在 XXF Studio 中寻找你感兴趣的内容 ✦';
      results.appendChild(empty);
      return;
    }
    const matches = (records || []).filter(item => {
      const haystack = [item.title, stripHtml(item.content), ...(item.categories || []), ...(item.tags || [])].join(' ').toLowerCase();
      return haystack.includes(keyword);
    }).slice(0, 20);
    status.textContent = matches.length ? '找到 ' + matches.length + ' 条相关内容' : '没有找到与“' + query.trim() + '”相关的内容';
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'xxf-search-empty';
      empty.textContent = '换一个关键词试试吧';
      results.appendChild(empty);
      return;
    }
    matches.forEach(item => {
      const link = document.createElement('a');
      link.className = 'xxf-search-result';
      try { link.href = new URL(item.url, location.origin).pathname; } catch (_) { link.href = item.url; }
      const title = document.createElement('div');
      title.className = 'xxf-search-title';
      title.textContent = item.title || '未命名文章';
      const excerpt = document.createElement('div');
      excerpt.className = 'xxf-search-excerpt';
      const plain = stripHtml(item.content);
      const at = plain.toLowerCase().indexOf(keyword);
      const start = Math.max(0, at - 45);
      excerpt.textContent = (start > 0 ? '…' : '') + plain.slice(start, start + 120) + (plain.length > start + 120 ? '…' : '');
      link.append(title, excerpt);
      results.appendChild(link);
    });
  };

  document.addEventListener('click', event => {
    const button = event.target.closest('li.item.search');
    if (button) {
      event.preventDefault();
      event.stopPropagation();
      open();
      return;
    }
    if (event.target === overlay || event.target.closest('#xxf-search-close')) close();
  }, true);
  input.addEventListener('input', () => render(input.value));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && overlay.classList.contains('open')) close();
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      open();
    }
  });
})();
</script><!-- hexo injector body_end end --></body></html>
